plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.oopsscam'
version = '1.0.0'

android {
  namespace 'expo.modules.oopsscamvision'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
